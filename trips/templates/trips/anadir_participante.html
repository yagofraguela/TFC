<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Añadir Participante</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6fff6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #2e7d32;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2e7d32;
        }
        label {
            font-weight: bold;
            color: #2e7d32;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #2e7d32;
        }
        button {
            background: #2e7d32;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #1b5e20;
        }
        a {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Añadir participante a {{ lugar.nombre }}</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Crear nuevo usuario -->
        <label for="id_nombre_nuevo">Crear usuario nuevo</label>
        {{ form.nombre_nuevo }}

        <button type="submit">Añadir</button>
    </form>

    <a href="{% url 'detalle_lugar' lugar.id %}">Volver</a>
</div>

</body>
</html>
