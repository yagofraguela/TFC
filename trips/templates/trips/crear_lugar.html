{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear nuevo destino</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f5f0;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2e7d32;
            color: white;
            padding: 15px;
        }

        .header-container {
            display: flex;
            justify-content: flex-start; /* logo izquierda */
            align-items: center;
            margin-left: 15px;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #2e7d32;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2e7d32;
            text-align: center;
        }

        label {
            font-weight: bold;
            color: #2e7d32;
            display: block;
            margin-top: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #2e7d32;
            font-size: 14px;
        }

        button {
            background-color: #2e7d32;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #1b5e20;
        }

        a {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <img src="{% static 'trips/img/foto.png' %}" 
                 alt="TriTrip Logo"
                 style="width: 200px; border-radius: 12px;">
        </div>
    </header>

    <div class="container">
        <h2>Crear nuevo destino</h2>

        <form method="POST">
            {% csrf_token %}
            
            <label for="id_nombre">Nombre del destino</label>
            {{ form.nombre }}

            <label for="id_descripcion">Descripción</label>
            {{ form.descripcion }}

            <button type="submit">Crear destino</button>
        </form>

        <a href="{% url 'dashboard' %}">← Volver al dashboard</a>
    </div>

</body>
</html>
